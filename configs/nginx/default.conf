server {
    listen 80;
    server_name _;

    # Log format for Wazuh monitoring
    log_format wazuh_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               '$request_time';

    access_log /var/log/nginx/access.log wazuh_combined;
    error_log  /var/log/nginx/error.log warn;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Patient portal login — monitored by Wazuh Rule 100012
    location ~ ^/(login|signin|portal|auth) {
        proxy_pass http://localhost:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Log extended info for credential access monitoring
        access_log /var/log/nginx/portal_access.log wazuh_combined;
    }

    # Block direct PACS access from DMZ (HIPAA enforcement)
    location ~ ^/pacs/ {
        return 403 "HIPAA: Direct PACS access from portal is prohibited";
    }

    # Health check endpoint
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
