<ossec_config>
  <!-- ================================================================
       DIC SOC Lab — Wazuh Manager Configuration
       Wazuh 4.7.5 | Single-node manager
       ================================================================ -->

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <!-- logall indexes ALL events (not just alerts) into alerts index — enables full timeline in dashboard -->
    <logall>yes</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>1h</agents_disconnection_time>
    <agents_disconnection_alert_time>30m</agents_disconnection_alert_time>
  </global>

  <alerts>
    <!-- Level 3+ gets logged, level 5+ shown in dashboard by default -->
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ── Agent communication ─────────────────────────────────────── -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ── Agent enrollment (authd) ───────────────────────────────── -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <force>
      <enabled>yes</enabled>
      <disconnected_time enabled="yes">1h</disconnected_time>
      <after_registration_time>1h</after_registration_time>
    </force>
  </auth>

  <!-- ── IR: automated containment commands ─────────────────────── -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Stateful containment for high-impact custom rules -->
  <active-response>
    <command>firewall-drop</command>
    <location>all</location>
    <rules_id>100001,100005,100011</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- ── Cluster (single-node, disabled) ────────────────────────── -->
  <cluster>
    <name>wazuh</name>
    <node_name>manager-node</node_name>
    <node_type>master</node_type>
    <key>c98b62a9b6169ac5f67dae55ae4a9088</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh.manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>no</disabled>
  </cluster>

  <!-- ── Ruleset ─────────────────────────────────────────────────── -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- ── Manager-side SCA / Vulnerability detection ─────────────── -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <provider name="canonical">
      <enabled>yes</enabled>
      <os>trusty</os>
      <os>xenial</os>
      <os>bionic</os>
      <os>focal</os>
      <os>jammy</os>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="debian">
      <enabled>yes</enabled>
      <os>buster</os>
      <os>bullseye</os>
      <update_interval>1h</update_interval>
    </provider>

    <provider name="nvd">
      <enabled>yes</enabled>
      <update_from_year>2010</update_from_year>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <global>
    <white_list>10.10.0.0/24</white_list>
    <white_list>127.0.0.1</white_list>
  </global>

  <!-- ── Localfile sources on the manager itself ─────────────────── -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- ── Wazuh API audit log ─────────────────────────────────────── -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/ossec/logs/api.log</location>
  </localfile>

  <!-- ── Patient Portal auth log (web-server via shared volume) ─── -->
  <!-- Volume: web-logs-portal → /var/web-logs/portal              -->
  <!-- Format: PORTAL_LOGIN SUCCESS src=x user=x ua=x              -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/web-logs/portal/auth.log</location>
  </localfile>

  <!-- ── RIS Server logs (via shared volume) ────────────────────── -->
  <!-- Portal auth log: same PORTAL_LOGIN format as web-server      -->
  <!-- HL7 log: INFO [HL7-ADT] events                               -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ris-logs/portal/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ris-logs/ris/ris.log</location>
  </localfile>

  <!-- ── Orthanc PACS logs (via shared volume) ──────────────────── -->
  <!-- Format: W<ISO-ts>Z Orthanc <message>                         -->
  <!-- label program_name=orthanc scopes decoder to avoid IIS       -->
  <!-- decoder hijack (built-in windows-date-format)                -->
  <localfile>
    <log_format>syslog</log_format>
    <label key="program_name">orthanc</label>
    <location>/var/pacs-logs/orthanc/orthanc.log</location>
  </localfile>

  <!-- ── Nginx access log (web-server via shared volume) ────────── -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/web-logs/nginx/access.log</location>
  </localfile>

  <!-- ── Suricata IDS logs (via volume) ───────────────────────────── -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

</ossec_config>