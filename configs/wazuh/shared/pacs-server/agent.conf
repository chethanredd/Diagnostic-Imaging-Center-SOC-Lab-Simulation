<agent_config>
  <!--
    DIC SOC Lab — pacs-server group
    Specific monitoring for PACS (Orthanc + DICOM directory).
  -->

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- DICOM files — realtime ransomware detection -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/dicom_test</directories>

    <!-- Orthanc config changes -->
    <directories check_all="yes" realtime="yes">/etc/orthanc</directories>

    <!-- System directories -->
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>

    <file_limit>
      <enabled>yes</enabled>
      <entries>50000</entries>
    </file_limit>

    <ignore type="sregex">.log$</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- Orthanc PACS logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/orthanc/orthanc.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
  </active-response>

</agent_config>
