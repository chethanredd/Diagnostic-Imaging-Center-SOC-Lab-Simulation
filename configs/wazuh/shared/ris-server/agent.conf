<agent_config>
  <!--
    DIC SOC Lab — ris-server group
    Specific monitoring for the Radiology Information System.
  -->

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- RIS application directory — detect unauthorized file changes -->
    <directories check_all="yes" realtime="yes">/opt/ris</directories>
    <directories check_all="yes" realtime="yes">/var/log/ris</directories>

    <!-- System directories -->
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>

    <file_limit>
      <enabled>yes</enabled>
      <entries>50000</entries>
    </file_limit>

    <ignore type="sregex">.log$</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- RIS application log — HL7 messages, patient record access -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ris/ris.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
  </active-response>

</agent_config>
