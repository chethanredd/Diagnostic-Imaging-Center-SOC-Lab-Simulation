<agent_config>
  <!--
    DIC SOC Lab — Default Group Agent Configuration
    Applied to ALL enrolled agents automatically.
    This file MUST exist to prevent wazuh-db "groups empty" warnings.
  -->

  <!-- Common syscheck for all Linux agents -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- System integrity -->
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>

    <!-- Ignore transient files -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore type="sregex">.log$|.tmp$|.swp$|.swx$</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- Common log sources for all agents -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- Active response enabled for all agents -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

</agent_config>
