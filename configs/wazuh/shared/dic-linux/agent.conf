<agent_config>
  <!--
    DIC SOC Lab — dic-linux group
    Applied to all Linux agents (PACS, RIS, web-server).
    Covers Linux-specific log sources and FIM paths.
  -->

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Critical Linux paths -->
    <directories check_all="yes" realtime="yes">/etc/cron.d,/etc/cron.daily</directories>
    <directories check_all="yes">/etc/passwd,/etc/shadow,/etc/group</directories>
    <directories check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>

    <file_limit>
      <enabled>yes</enabled>
      <entries>50000</entries>
    </file_limit>

    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore type="sregex">.log$</ignore>
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
  </syscheck>

  <!-- PAM / auth logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Kernel ring / boot -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
  </active-response>

</agent_config>
