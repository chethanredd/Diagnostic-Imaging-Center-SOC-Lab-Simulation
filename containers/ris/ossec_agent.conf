<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>dic-linux,ris-server</config-profile>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>WAZUH_MANAGER_IP</manager_address>
      <port>1515</port>
      <agent_name>ris-server</agent_name>
      <auto_method>yes</auto_method>
    </enrollment>
  </client>

  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/opt/ris</directories>
    <directories check_all="yes" realtime="yes">/var/log/ris</directories>
  </syscheck>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ris/ris.log</location>
  </localfile>

  <active-response>
    <disabled>no</disabled>
  </active-response>
</ossec_config>
