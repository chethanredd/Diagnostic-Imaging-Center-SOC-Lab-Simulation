<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>dic-linux, pacs-server</config-profile>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>WAZUH_MANAGER_IP</manager_address>
      <port>1515</port>
      <agent_name>pacs-server</agent_name>
      <auto_method>yes</auto_method>
    </enrollment>
  </client>

  <!-- File Integrity Monitoring — DICOM directory -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- DICOM test files — realtime ransomware detection -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/dicom_test</directories>

    <!-- Orthanc config changes -->
    <directories check_all="yes" realtime="yes">/etc/orthanc</directories>

    <!-- System directories -->
    <directories>/etc,/usr/bin,/usr/sbin,/bin,/sbin</directories>

    <file_limit>
      <enabled>yes</enabled>
      <entries>50000</entries>
    </file_limit>
  </syscheck>

  <!-- Monitor Orthanc, auth, syslog -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/orthanc/orthanc.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Active response: auto-block on detection -->
  <active-response>
    <disabled>no</disabled>
  </active-response>
</ossec_config>
